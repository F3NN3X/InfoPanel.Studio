<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .ring { animation: spin 6s linear infinite; transform-origin: center; transform-box: fill-box; }
  </style>
  <circle class="ring" cx="50" cy="50" r="40" fill="none" stroke="#5EF6FF" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>
  <rect x="47" y="47" width="6" height="6" fill="#FFD23F" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
