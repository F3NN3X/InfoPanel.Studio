name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Check the tag matches package.json and CHANGELOG.md
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # The notes are this version's CHANGELOG.md section, from its heading to the next one.
          awk -v v="$version" '/^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # The snapshot tests render the clock in the machine's locale; match the one they were taken in.
      - name: Use the en-150 locale
        shell: pwsh
        run: Set-Culture en-150
      - run: npm ci
      - run: npm test
      - name: Check the updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; the updater artifacts cannot be signed"
            exit 1
          fi

      # src-tauri/tauri.updater.conf.json is merged over tauri.conf.json: the updater artifacts (and the
      # signature that needs the private key) are only made here, so a local desktop:build works without
      # the key. (Tauri 2 ignores a TAURI_CONFIG variable; --config takes the file.)
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run desktop:build -- --config src-tauri/tauri.updater.conf.json

      # GitHub turns the spaces of an asset name into dots, so upload space-free names; latest.json
      # (tools/updater-manifest.mjs) points the updater at the installer by that name.
      - name: Stage the release files
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir release
          cp "src-tauri/target/release/bundle/nsis/InfoPanel Studio_${version}_x64-setup.exe" "release/InfoPanel-Studio_${version}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/InfoPanel Studio_${version}_x64-setup.exe.sig" "release/InfoPanel-Studio_${version}_x64-setup.exe.sig"
          node tools/updater-manifest.mjs --version="$version" --sig="release/InfoPanel-Studio_${version}_x64-setup.exe.sig" --notes=notes.md --out=release/latest.json

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*-setup.exe release/*-setup.exe.sig release/latest.json \
            --title "InfoPanel Studio $GITHUB_REF_NAME" \
            --notes-file notes.md
