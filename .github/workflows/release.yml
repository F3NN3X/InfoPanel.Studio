name: Release

# A tag vX.Y.Z publishes the installer. `gate` checks the tag and that CI vouches for the commit; then the installer
# build (Windows) and the e2e specs (Linux), which regular CI leaves out (e2e.yml, by hand), run side by side, and `publish` needs
# both. The unit and Rust tests are not run again: the commit's own CI (release-gate.mjs) already passed them. Nothing
# here saves a cache: one saved under a tag is restored by no other ref.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The release gate reads the commit's check runs, its pull request and the nightly's runs.
      checks: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag matches package.json and CHANGELOG.md
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # The notes are this version's CHANGELOG.md section, from its heading to the next one.
          awk -v v="$version" '/^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      # A release comes from a commit CI vouches for: a green ci-ok on it or on the pull request that merged it, or the
      # last green nightly's commit (tools/ci/release-gate.mjs).
      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/release-gate.mjs --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 1

  build:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The signed build installs from scratch: npm ci verifies every package against the lockfile (the npm
      # cache holds only those verified tarballs). Node is only the build tool for the web app; nothing of it ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # The release-profile cache the nightly's installer build saves on main (nightly.yml), so the dependencies come
          # prebuilt; CI's `tauri` cache holds debug builds only, which left this build compiling every crate (11.5 min).
          shared-key: tauri-release
          save-if: false
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - name: Check the updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; the updater artifacts cannot be signed"
            exit 1
          fi

      # src-tauri/tauri.updater.conf.json is merged over tauri.conf.json: the updater artifacts (and the
      # signature that needs the private key) are only made here, so a local desktop:build works without
      # the key. (Tauri 2 ignores a TAURI_CONFIG variable; --config takes the file.)
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run desktop:build -- --config src-tauri/tauri.updater.conf.json

      # GitHub turns the spaces of an asset name into dots, so upload space-free names; latest.json
      # (tools/updater-manifest.mjs) points the updater at the installer by that name.
      - name: Stage the release files
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir release
          cp "src-tauri/target/release/bundle/nsis/InfoPanel Studio_${version}_x64-setup.exe" "release/InfoPanel-Studio_${version}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/InfoPanel Studio_${version}_x64-setup.exe.sig" "release/InfoPanel-Studio_${version}_x64-setup.exe.sig"
          node tools/updater-manifest.mjs --version="$version" --sig="release/InfoPanel-Studio_${version}_x64-setup.exe.sig" --notes=notes.md --out=release/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          retention-days: 1

  # The e2e specs PRs skip, against this commit's own build. A stable tag only: a beta (vX.Y.Z-beta.N) is published once the
  # installer builds, since its commit already passed the gate and ship's local verify (the smoke e2e specs and the changed
  # ones; the nightly runs every spec).
  e2e:
    needs: gate
    if: ${{ !contains(github.ref_name, '-beta.') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # the specs split three ways, one-editor in part 1 (tools/ci/run-commands.mjs); publish needs every part
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - run: npm run build
      - uses: ./.github/actions/e2e
        with:
          save-cache: "false"
          shard: ${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: .cache/playwright
          # .cache is a hidden folder, which upload-artifact leaves out by default: the report was never uploaded
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: [build, e2e]
    # e2e is skipped for a beta; a stable tag still needs it green
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && contains(github.ref_name, '-beta.'))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      # A vX.Y.Z-beta.N tag is a prerelease, so releases/latest (the stable feed) never points at it.
      - name: Publish the GitHub release
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-beta.*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            release/*-setup.exe release/*-setup.exe.sig release/latest.json \
            --title "InfoPanel Studio $GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"

  # The one job that writes shared state, the updater-beta feed, so the only one with a concurrency group: feed writes
  # queue, never cancel one in progress. GitHub keeps one pending run per group, so a queued feed job can be replaced
  # by a newer one. That is harmless: every tag's build and release (`publish`) ran on its own, and the feed only needs
  # the newest version. A job that does run writes its own version unless the feed already holds a newer one
  # (tools/ci/feed-newer.mjs), so the feed never moves backwards, whatever order the jobs run or get dropped in. Only
  # tags pushed out of version order can leave a dropped job's version out of the feed, and then the newer version is
  # the one the feed keeps; the dropped tag's GitHub release exists regardless.
  feed:
    needs: publish
    # explicit: a skipped e2e upstream (a beta) would otherwise skip this job too
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: updater-feed
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # The beta channel reads latest.json from the fixed updater-beta release. Every release, beta or
      # stable, overwrites it, so beta users also get a stable release that is newer than their beta, unless the
      # feed already points at a newer version than this tag.
      - name: Update the beta update feed
        run: |
          # Created only when it is missing; any other lookup failure stops here.
          if ! found=$(gh release view updater-beta --json tagName 2>&1); then
            if ! grep -qi "release not found" <<< "$found"; then
              echo "::error::Could not look up the updater-beta release: $found"
              exit 1
            fi
            gh release create updater-beta --prerelease --target "$GITHUB_SHA" \
              --title "Beta update feed" \
              --notes "Holds the beta channel's update feed (latest.json) for InfoPanel Studio's updater. Not a release to install: the installers are on the version releases."
          fi
          # No feed file yet (new release, or no asset): nothing to compare, so the guard says write.
          mkdir current
          gh release download updater-beta --pattern latest.json --dir current || echo "No current feed file."
          version=$(node -p "require('./package.json').version")
          decision=$(node tools/ci/feed-newer.mjs --version "$version" --feed current/latest.json)
          if [ "$decision" = "skip" ]; then
            echo "Feed left alone: it already points at a newer version than $version. The $GITHUB_REF_NAME release is published."
            exit 0
          fi
          gh release upload updater-beta release/latest.json --clobber
