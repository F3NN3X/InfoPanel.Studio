name: Release

# A tag vX.Y.Z publishes the installer. `gate` checks the tag and that CI vouches for the commit; then the installer
# build (Windows) and the e2e specs (Linux), which PRs leave to the ci:e2e label, run side by side, and `publish` needs
# both. The unit and Rust tests are not run again: the commit's own CI (release-gate.mjs) already passed them. Nothing
# here saves a cache: one saved under a tag is restored by no other ref.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The release gate reads the commit's check runs, its pull request and the nightly's runs.
      checks: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag matches package.json and CHANGELOG.md
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # The notes are this version's CHANGELOG.md section, from its heading to the next one.
          awk -v v="$version" '/^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      # A release comes from a commit CI vouches for: a green ci-ok on it or on the pull request that merged it, or the
      # last green nightly's commit (tools/ci/release-gate.mjs).
      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/release-gate.mjs --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 1

  build:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The signed build installs from scratch: npm ci verifies every package against the lockfile (the npm
      # cache holds only those verified tarballs). Node is only the build tool for the web app; nothing of it ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Restores the Rust cache CI saved on main (merged code only; PR runs save to their own scope).
          shared-key: tauri
          save-if: false
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - name: Check the updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; the updater artifacts cannot be signed"
            exit 1
          fi

      # src-tauri/tauri.updater.conf.json is merged over tauri.conf.json: the updater artifacts (and the
      # signature that needs the private key) are only made here, so a local desktop:build works without
      # the key. (Tauri 2 ignores a TAURI_CONFIG variable; --config takes the file.)
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run desktop:build -- --config src-tauri/tauri.updater.conf.json

      # GitHub turns the spaces of an asset name into dots, so upload space-free names; latest.json
      # (tools/updater-manifest.mjs) points the updater at the installer by that name.
      - name: Stage the release files
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir release
          cp "src-tauri/target/release/bundle/nsis/InfoPanel Studio_${version}_x64-setup.exe" "release/InfoPanel-Studio_${version}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/InfoPanel Studio_${version}_x64-setup.exe.sig" "release/InfoPanel-Studio_${version}_x64-setup.exe.sig"
          node tools/updater-manifest.mjs --version="$version" --sig="release/InfoPanel-Studio_${version}_x64-setup.exe.sig" --notes=notes.md --out=release/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          retention-days: 1

  # The e2e specs PRs skip, against this commit's own build.
  e2e:
    needs: gate
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - run: npm run build
      - uses: ./.github/actions/e2e
        with:
          save-cache: "false"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: .cache/playwright
          retention-days: 7

  publish:
    needs: [build, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      # A vX.Y.Z-beta.N tag is a prerelease, so releases/latest (the stable feed) never points at it.
      - name: Publish the GitHub release
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-beta.*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            release/*-setup.exe release/*-setup.exe.sig release/latest.json \
            --title "InfoPanel Studio $GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"

      # The beta channel reads latest.json from the fixed updater-beta release. Every release, beta or
      # stable, overwrites it, so beta users also get a stable release that is newer than their beta.
      - name: Update the beta update feed
        run: |
          # Created only when it is missing; any other lookup failure stops here.
          if ! found=$(gh release view updater-beta --json tagName 2>&1); then
            if ! grep -qi "release not found" <<< "$found"; then
              echo "::error::Could not look up the updater-beta release: $found"
              exit 1
            fi
            gh release create updater-beta --prerelease --target "$GITHUB_SHA" \
              --title "Beta update feed" \
              --notes "Holds the beta channel's update feed (latest.json) for InfoPanel Studio's updater. Not a release to install: the installers are on the version releases."
          fi
          gh release upload updater-beta release/latest.json --clobber
