name: Nightly

# The slow, complete run CI's selective plan leaves out: every check on Linux and on Windows (with the real desktop
# resources and an unsigned installer build), the perf suites in report-only mode, and one "Nightly failing" issue that
# follows the result. 23:30 UTC is 01:30 in Oslo in summer (CEST) and 00:30 in winter (CET), outside 07:00 to 18:00.
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      issues:
        description: Open, update or close the "Nightly failing" issue from this run (always done on the schedule)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # A scheduled night with main where the last green nightly left it has nothing new to check, so the other jobs skip
  # (the skipped run stays green on that commit, which release-gate.mjs accepts). A manual run always runs.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.last.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: last
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # An API error is tried again; if it persists, run the night (an empty $last never matches the commit).
          retry() { for delay in 2 5; do "$@" && return 0; sleep "$delay"; done; "$@"; }
          last=$(retry gh run list --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty') || {
            echo "::warning::could not read the last green nightly: running"
            last=
          }
          if [ "$EVENT" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still ${GITHUB_SHA::7}, where the last green nightly ran: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Every check in tests/feature-map.json on Linux. cargo-app needs Windows, so exit 3 (incomplete) is expected here
  # and the Windows job covers it.
  linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: native
      - uses: ./.github/actions/playwright-install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/actionlint
          key: actionlint-${{ runner.os }}-${{ hashFiles('tools/ci/actionlint.mjs') }}
      - run: node tools/verify.mjs --full --allow-incomplete
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Windows: the unsigned installer build (what release.yml does without the updater key, so packaging breaks show here
  # first), then every check with cargo-app running against the real resources it just prepared.
  windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # Its own key: the installer build is the release profile, which CI's `tauri` cache (debug builds) never holds. Saved on
      # main only, so release.yml (a tag can read main's caches) starts from prebuilt release dependencies.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: tauri-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run desktop:build
      - run: npx playwright install chromium
      # A check that needs something the runner doesn't have, or is local only (look-visual: this PC's text rendering,
      # _docs/TESTING.md), reports "not run" (exit 3), so incomplete is not a failure.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/actionlint
          key: actionlint-${{ runner.os }}-${{ hashFiles('tools/ci/actionlint.mjs') }}
      - run: node tools/verify.mjs --full --allow-incomplete
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The perf suites measure and never gate (_docs/performance.md). The JSON goes up as an artifact, and the table against
  # the previous nightly's artifact lands in the run summary.
  perf:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    env:
      PERF_LABEL: nightly
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: native
      - run: cargo build -p ips-server
        working-directory: src-tauri
      - uses: ./.github/actions/playwright-install
      - run: npm run perf:all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-nightly
          path: .cache/perf/nightly
          # .cache is a hidden folder, which upload-artifact leaves out by default: the report was never uploaded
          include-hidden-files: true
          retention-days: 30
      # The newest earlier run that measured: a skipped night has no perf artifact.
      - name: Compare with the previous nightly
        run: |
          for previous in $(gh run list --workflow nightly.yml --status completed --limit 15 --json databaseId --jq '.[] | select(.databaseId != ${{ github.run_id }}) | .databaseId'); do
            if gh run download "$previous" -n perf-nightly -D .cache/perf/previous 2>/dev/null; then
              node tools/perf/compare.mjs previous nightly | tee .cache/perf/compare.md >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "No previous nightly perf artifact to compare with." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-compare
          path: .cache/perf/compare.md
          # .cache is a hidden folder, which upload-artifact leaves out by default: the report was never uploaded
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # Advisories appear without a code change, so this runs every night, even when main has not moved.
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/audit

  # One issue, "Nightly failing": opened (or commented on) when a run fails, commented on and closed when one passes.
  # Only the schedule or an explicit `issues` input touches issues; the job holds no other permission.
  report:
    needs: [linux, windows, perf, audit]
    if: always() && (github.event_name == 'schedule' || inputs.issues)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ needs.linux.result }} ${{ needs.windows.result }} ${{ needs.audit.result }}
    steps:
      - run: |
          # A failed night is the one that must reach the issue: an API error is tried again.
          retry() { for delay in 2 5; do "$@" && return 0; sleep "$delay"; done; "$@"; }
          existing=$(retry gh issue list --state open --search '"Nightly failing" in:title' --json number,title --jq '[.[] | select(.title == "Nightly failing")][0].number // empty')
          case " $RESULTS " in
            *" failure "*)
              if [ -n "$existing" ]; then
                retry gh issue comment "$existing" --body "Still failing: $RUN_URL"
              else
                retry gh issue create --title "Nightly failing" --body "The nightly run failed: $RUN_URL"
              fi ;;
            *" cancelled "*|*" skipped "*) echo "Run was cancelled or skipped: leaving the issue as it is." ;;
            *)
              if [ -n "$existing" ]; then
                retry gh issue comment "$existing" --body "Green again: $RUN_URL"
                retry gh issue close "$existing"
              fi ;;
          esac
