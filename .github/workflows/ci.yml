name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The snapshot tests render the clock in the machine's locale; match the one they were taken in.
      - name: Use the en-150 locale
        shell: pwsh
        run: Set-Culture en-150
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The Tauri build script wants the bundled resources (the studio and Node) in place before it compiles.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run desktop:web
      - run: npm run desktop:prepare
      - name: cargo test
        run: cargo test
        working-directory: src-tauri
