name: CI

# PRs run the checks. A push to main runs them only when the dependencies change: GitHub shares caches
# saved on main with every PR, so this keeps the npm, Node and Rust caches warm for the next PRs.
# Every code change already passed this check in its PR, and a release tag re-runs the tests in release.yml.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - package-lock.json
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - tools/desktop-prepare.mjs
      - .github/workflows/ci.yml

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts the change touches. A push to main (a dependency change) runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      native: ${{ steps.diff.outputs.native }}
    steps:
      # Depth 2: the PR's merge commit and its first parent (the base).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || git diff --name-only HEAD^1 HEAD | grep -qE '^(src-tauri/|tools/desktop-prepare\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
          # The native server (ips-server) is checked against the Node server's tests, fixtures and e2e suite, so a
          # change to either server, its tests or the parity tooling runs that job too.
          if [ "${{ github.event_name }}" != "pull_request" ] \n            || git diff --name-only HEAD^1 HEAD | grep -qE '^(src-tauri/|server\.mjs$|server/|tools/(parity|perf)/|tests/(server|e2e|fixtures)/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi

  # Lint, typecheck, build and the Vitest suite.
  web:
    runs-on: ubuntu-latest
    # The snapshot tests render the clock in the en-150 locale.
    env:
      LANG: en_150.UTF-8
      LC_ALL: en_150.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Biome lint (biome.json); the formatter is off until a one-off format commit.
      - run: npx biome ci
      - run: npm run build
      - run: npm test
      # The parity fixtures the native server's tests load must match what the Node server produces now.
      - run: npm run parity:check
      # The deterministic bundle budgets (tools/perf/budgets.json); CPU and memory stay report-only.
      - run: npm run perf:budgets
      # The e2e suite against dist/ on a scratch server (tools/perf/scratch.mjs).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The Rust tests, only when the change touches the desktop app.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # The Node runtime desktop:prepare bundles, pinned by version in tools/desktop-prepare.mjs.
      - uses: actions/cache@v6
        with:
          path: .cache/desktop/node-v*
          key: desktop-node-${{ hashFiles('tools/desktop-prepare.mjs') }}
      # shared-key: the release job reuses this cache (its key would otherwise include the job name).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri
      # The Tauri build script wants the bundled pages and resources in place before it compiles. The web
      # job typechecks, so these build with Vite alone.
      - run: npx vite build --outDir .cache/desktop/dist --emptyOutDir
      - run: npm run desktop:settings
      - run: npm run desktop:prepare
      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  # Both servers, on Linux and Windows: the Node server's suite, the same suite against ips-server, the Rust tests of
  # the two crates (the Tauri app builds on Windows only, see the rust job) and the differential check. Linux also runs
  # the e2e suite against ips-server.
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Its own key: the tauri cache belongs to the rust and release jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: native
      - run: npm run test:server:node
      - run: npm run test:server:native
      - name: cargo test
        run: cargo test -p ips-server -p ips-agent
        working-directory: src-tauri
      - run: npm run parity:servers
      - if: runner.os == 'Linux'
        run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      # test:server:native built the debug binary the scratch server runs.
      - if: runner.os == 'Linux'
        run: npm run test:e2e
        env:
          SERVER_IMPL: native
