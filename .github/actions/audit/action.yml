name: Audit the dependencies
description: Known advisories in the shipped npm dependencies (blocking) and the whole npm tree (informational), then cargo-deny on the Rust workspace (deny.toml).

runs:
  using: composite
  steps:
    # npm audit reads package-lock.json and the registry; it needs no node_modules.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: npm audit (shipped dependencies)
      shell: bash
      run: npm audit --omit=dev --audit-level=high
    # Dev tools never reach the installer, so their advisories are reported, not gating.
    - name: npm audit (everything, informational)
      shell: bash
      run: npm audit --audit-level=high || echo "::warning::npm audit found high or critical advisories in dev dependencies"
    - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
      with:
        manifest-path: src-tauri/Cargo.toml
        command: check advisories bans sources
