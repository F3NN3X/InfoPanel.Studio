# One weekly PR per ecosystem, majors included: one rebase, one verify and one CI run instead of a queue of PRs that
# conflict in the lockfile as each one merges. A major that breaks is fixed in that PR. It also keeps crates that must
# move in step together (windows and windows-core, #392). Each PR runs ci.yml like any other change; the merge gate is
# still the local verify that `npm run ship` posts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly, day: monday }
    # windows-core ships ahead of windows (0.100 while windows is at 0.62); taken alone it splits the COM types from the
    # windows crate's (#392, #395). It moves by hand, in the same change as windows.
    ignore:
      - dependency-name: windows-core
    groups:
      cargo: { patterns: ["*"] }
  # Bumps the SHA pins and their `# vX.Y.Z` comments, in the workflows and the composite actions.
  # dtolnay/rust-toolchain is pinned to its `stable` branch, which has no releases to move to.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: monthly }
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions: { patterns: ["*"] }
