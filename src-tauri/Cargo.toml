[package]
name = "infopanel-studio"
version = "1.3.1-beta.5"
description = "InfoPanel Studio: the studio and dashboard server as one desktop app"
edition = "2021"
publish = false

[lib]
name = "infopanel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [".", "crates/ips-server", "crates/ips-agent"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sysinfo = "0.37"
tokio = "1"
axum = { version = "0.8", default-features = false }
tower-http = "0.6"
http-body = "1"
futures-util = { version = "0.3", default-features = false }
url = "2"
socket2 = "0.6"
tempfile = "3"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false }
chrono = { version = "0.4", default-features = false }
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
sysinfo = { workspace = true }
if-addrs = "0.13"
ips-agent = { path = "crates/ips-agent" }
ips-server = { path = "crates/ips-server" }
tokio = { workspace = true, features = ["sync"] }
# Experimental touch (src/touch): raw USB touch input from touch-kit, pinned to a release tag.
touch-core = { git = "https://github.com/F3NN3X/touch-kit", tag = "v1.2.1" }
# The never-activating window of the touch setup overlays.
touch-kit-tauri = { git = "https://github.com/F3NN3X/touch-kit", tag = "v1.2.1" }
# touch-core logs through tracing; its "log" feature hands those lines to the app log.
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
# The same versions Tauri's wry uses: the WebView2 controller `with_webview` hands out is theirs.
webview2-com = "0.39"
windows-core = "0.62"
# The body of a framed page handed back to WebView2 (src/unframe.rs).
base64 = { workspace = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
