[package]
name = "ips-battery"
version = "0.1.0"
edition = "2024"
publish = false
description = "Battery levels of wireless devices: the poll core ported verbatim from the batterymon-proto prototype, driven by ips-server"

[features]
# Exposes the scripted HID transport (hid::mock, hid::test_seam) to tests outside the crate.
test-mock = []

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_SerialCommunication",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_Networking_WinSock",
    "Win32_UI_Input_XboxController",
] }
