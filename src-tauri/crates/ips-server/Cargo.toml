[package]
name = "ips-server"
version = "1.3.0-beta.17"
description = "InfoPanel Studio's dashboard server"
edition = "2021"
publish = false

[[bin]]
name = "ips-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
base64 = { workspace = true }
chrono = { workspace = true, features = ["std", "clock"] }
chrono-tz = "0.10"
futures-util = { workspace = true }
http-body = { workspace = true }
hyper = { version = "1", default-features = false }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
socket2 = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
tower-http = { workspace = true, features = ["catch-panic"] }
url = { workspace = true }
uuid = { version = "1", default-features = false, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
