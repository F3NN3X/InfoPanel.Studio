[package]
name = "ips-server"
version = "1.3.0-beta.16"
description = "InfoPanel Studio's dashboard server"
edition = "2021"
publish = false

[[bin]]
name = "ips-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
futures-util = { workspace = true }
http-body = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
socket2 = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal", "io-util"] }
tower-http = { workspace = true, features = ["catch-panic"] }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
